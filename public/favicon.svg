<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff733"/>
      <stop offset="70%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Shadow & Base Border -->
  <path d="M 50,4 C 68,4 88,14 94,32 C 96,62 88,96 50,126 C 12,96 4,62 6,32 C 12,14 32,4 50,4 Z" fill="#001e40" filter="url(#shadow)"/>
  
  <!-- Main Shield Body (Kuning Kebesaran) -->
  <path d="M 50,7 C 66,7 85,16 90,33 C 92,61 85,93 50,121 C 15,93 8,61 10,33 C 15,16 34,7 50,7 Z" fill="url(#shieldGrad)" stroke="#b45309" stroke-width="0.8"/>

  <!-- Golden Star Top Center -->
  <polygon points="50,1 52.5,7 58.5,7.5 54,11.5 55.5,17.5 50,14 44.5,17.5 46,11.5 41.5,7.5 47.5,7" fill="#ffd700" stroke="#b45309" stroke-width="0.6"/>

  <!-- Draped Red & White Ribbon on Top -->
  <!-- Red Upper Half -->
  <path d="M 16,17 Q 34,9 50,14 Q 66,9 84,17 Q 89,23 85,28 Q 70,18 50,22 Q 30,18 15,28 Q 11,23 16,17 Z" fill="#dc2626"/>
  <!-- White Lower Half -->
  <path d="M 15,28 Q 30,18 50,22 Q 70,18 85,28 Q 83,32 78,30 Q 64,23 50,25 Q 36,23 22,30 Q 17,32 15,28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>

  <!-- Motto: NGESTI WIDDHI -->
  <text x="50" y="34" font-family="Arial, sans-serif" font-size="5" font-weight="900" text-anchor="middle" fill="#001e40" letter-spacing="0.5">NGESTI WIDDHI</text>

  <!-- Red Cogwheel (Roda Gigi) -->
  <g transform="translate(50, 62)">
    <circle r="22" fill="#dc2626" stroke="#991b1b" stroke-width="0.8"/>
    <!-- Cog teeth (12 teeth) -->
    <rect x="-3" y="-25" width="6" height="5" fill="#dc2626"/>
    <rect x="-3" y="20" width="6" height="5" fill="#dc2626"/>
    <rect x="-25" y="-3" width="5" height="6" fill="#dc2626"/>
    <rect x="20" y="-3" width="5" height="6" fill="#dc2626"/>
    <rect x="-19" y="-19" width="6" height="6" fill="#dc2626" transform="rotate(45)"/>
    <rect x="13" y="-19" width="6" height="6" fill="#dc2626" transform="rotate(45)"/>
    <rect x="-19" y="13" width="6" height="6" fill="#dc2626" transform="rotate(45)"/>
    <rect x="13" y="13" width="6" height="6" fill="#dc2626" transform="rotate(45)"/>
    <!-- Inner White Circle -->
    <circle r="17" fill="#ffffff" stroke="#dc2626" stroke-width="0.5"/>
  </g>

  <!-- Rice Stalk (Padi) Left Side -->
  <g fill="#eab308" stroke="#ca8a04" stroke-width="0.4">
    <ellipse cx="36" cy="48" rx="2.5" ry="4" transform="rotate(-30 36 48)"/>
    <ellipse cx="33" cy="54" rx="2.5" ry="4" transform="rotate(-20 33 54)"/>
    <ellipse cx="32" cy="61" rx="2.5" ry="4" transform="rotate(-5 32 61)"/>
    <ellipse cx="33" cy="68" rx="2.5" ry="4" transform="rotate(15 33 68)"/>
    <ellipse cx="36" cy="74" rx="2.5" ry="4" transform="rotate(35 36 74)"/>
    <ellipse cx="40" cy="79" rx="2.5" ry="4" transform="rotate(55 40 79)"/>
    <path d="M 38,45 Q 31,62 42,81" fill="none" stroke="#ca8a04" stroke-width="1.2"/>
  </g>

  <!-- Cotton Branch (Kapas) Right Side -->
  <g>
    <!-- Green Calyx -->
    <circle cx="62" cy="48" r="3.2" fill="#16a34a"/>
    <circle cx="66" cy="55" r="3.2" fill="#16a34a"/>
    <circle cx="67" cy="63" r="3.2" fill="#16a34a"/>
    <circle cx="65" cy="71" r="3.2" fill="#16a34a"/>
    <circle cx="61" cy="77" r="3.2" fill="#16a34a"/>
    <!-- White Cotton Flowers -->
    <circle cx="62" cy="48" r="2.3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>
    <circle cx="66" cy="55" r="2.3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>
    <circle cx="67" cy="63" r="2.3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>
    <circle cx="65" cy="71" r="2.3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>
    <circle cx="61" cy="77" r="2.3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>
  </g>

  <!-- Keris Luk in Center -->
  <g filter="url(#shadow)">
    <!-- Keris Blade (Wavy Luk) -->
    <path d="M 49,20 Q 52,28 48,36 Q 52,44 48,52 Q 52,60 48,68 Q 52,73 47,77 L 53,77 Q 48,73 52,68 Q 48,60 52,52 Q 48,44 52,36 Q 48,28 51,20 Z" fill="#94a3b8" stroke="#334155" stroke-width="0.6"/>
    <!-- Keris Hilt / Handle -->
    <rect x="48.5" y="77" width="3" height="5" rx="1" fill="#78350f" stroke="#451a03" stroke-width="0.5"/>
  </g>

  <!-- Ornate Pedestal / Stand (Landasan Keris) -->
  <path d="M 38,82 L 62,82 L 60,88 L 40,88 Z" fill="#166534" stroke="#14532d" stroke-width="0.6"/>
  <rect x="42" y="83" width="16" height="3" fill="#22c55e"/>

  <!-- Water Waves (Ombak Laut Biru) at Bottom -->
  <path d="M 10,95 Q 30,86 50,94 Q 70,86 90,95 Q 85,115 50,121 Q 15,115 10,95 Z" fill="url(#waterGrad)" stroke="#0284c7" stroke-width="0.8"/>
  <path d="M 12,98 Q 30,90 50,97 Q 70,90 88,98" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

  <!-- Boat & Banner: KENDAL 1605 -->
  <!-- Banner Body -->
  <path d="M 24,96 Q 50,91 76,96 L 73,114 Q 50,120 27,114 Z" fill="#ffffff" stroke="#001e40" stroke-width="1"/>
  <text x="50" y="105" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" fill="#001e40" letter-spacing="1">KENDAL</text>
  <text x="50" y="112" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle" fill="#001e40">1605</text>
</svg>
